
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botnet - WSB OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(40, 0, 0, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(40, 0, 0, 0.1) 0%, transparent 20%);
            color: #ff4444;
            font-family: 'Quantico', monospace;
            min-height: 100vh;
            padding-top: 60px;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(20, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            border-bottom: 1px solid #ff4444;
        }

        .nav-toggle {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            padding: 10px;
        }

        .dot {
            width: 20px;
            height: 2px;
            background-color: #ff4444;
            border-radius: 2px;
            transition: 0.3s;
        }

        .nav-toggle:hover .dot {
            background-color: #ff6666;
            box-shadow: 0 0 10px #ff6666;
        }

        .nav-links {
            display: none;
            flex-direction: column;
            gap: 15px;
            position: absolute;
            top: 50px;
            left: 20px;
            background: rgba(10, 0, 0, 0.95);
            width: 200px;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #ff4444;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .nav-links.active {
            display: flex;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-links a {
            color: #ff4444;
            text-decoration: none;
            padding: 8px 12px;
            border-left: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #ff6666;
            border-left: 2px solid #ff6666;
            text-shadow: 0 0 10px #ff6666;
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Logo Section */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 100% { transform: translateX(0) scale(1); }
            2% { transform: translateX(-2px) scale(1.01); }
            4% { transform: translateX(2px) scale(0.99); }
            6% { transform: translateX(-1px) scale(1); }
            98% { transform: translateX(0) scale(1); }
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #ff4444;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
            transition: all 0.3s ease;
        }

        .logo:hover {
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.8);
            transform: scale(1.05);
        }

        /* Text Sections */
        .title {
            text-align: center;
            color: white;
            font-size: 24px;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #ffaa00;
            font-size: 18px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }

        /* Search Bar */
        .search-container {
            display: flex;
            max-width: 500px;
            margin: 20px auto;
            background: rgba(20, 0, 0, 0.3);
            border: 1px solid #ff4444;
            border-radius: 25px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .search-container:focus-within {
            border-color: #ff6666;
            box-shadow: 0 0 20px rgba(255, 102, 102, 0.3);
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #ff4444;
            font-family: 'Quantico', monospace;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: #ff4444;
            opacity: 0.7;
        }

        .search-btn {
            padding: 12px 20px;
            background: rgba(255, 68, 68, 0.1);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: rgba(255, 68, 68, 0.2);
        }

        .search-btn img {
            width: 16px;
            height: 16px;
            filter: invert(40%) sepia(90%) saturate(1000%) hue-rotate(0deg);
        }

        /* Category Header */
        .cat {
            text-align: center;
            margin: 30px 0;
        }

        .heading {
            color: #ff4444;
            font-size: 32px;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.8);
            border-bottom: 2px solid #ff4444;
            padding-bottom: 10px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 68, 68, 0.8); }
            50% { text-shadow: 0 0 30px rgba(255, 68, 68, 1); }
        }

        /* Box Styles */
        .box {
            background: rgba(20, 0, 0, 0.3);
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 68, 68, 0.1), transparent);
            transition: left 0.5s;
        }

        .box:hover::before {
            left: 100%;
        }

        .box:hover {
            border-color: #ff6666;
            box-shadow: 0 0 20px rgba(255, 102, 102, 0.4);
            transform: translateY(-3px);
        }

        /* Post Items */
        .post-item {
            text-align: center;
        }

        .post-title {
            color: #ff6666;
            font-size: 22px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 102, 102, 0.6);
        }

        .view-post-button {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            text-decoration: none;
            border: 1px solid #ff4444;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-family: 'Quantico', monospace;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .view-post-button:hover {
            background: rgba(255, 68, 68, 0.2);
            color: #ff6666;
            border-color: #ff6666;
            box-shadow: 0 0 20px rgba(255, 102, 102, 0.4);
            transform: scale(1.05);
        }

        /* Panel for social links */
        .panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .cbox {
            background: rgba(20, 0, 0, 0.3);
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .cbox:hover {
            border-color: #ff6666;
            box-shadow: 0 0 20px rgba(255, 102, 102, 0.4);
            transform: translateY(-2px);
        }

        .icon {
            width: 40px;
            height: 40px;
            filter: invert(40%) sepia(90%) saturate(1000%) hue-rotate(0deg);
        }

        .txt {
            color: #ff4444;
            font-size: 16px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff4444, transparent);
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '⚠';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff4444;
            background: #0a0a0a;
            padding: 0 10px;
            font-size: 12px;
        }

        /* No Posts Message */
        .no-posts {
            text-align: center;
            color: #ff4444;
            font-size: 18px;
            margin: 40px 0;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
            padding: 20px;
            border: 1px dashed #ff4444;
            border-radius: 8px;
            background: rgba(20, 0, 0, 0.2);
        }

        /* Botnet Special Effects */
        .botnet-scan {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.1;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff4444, transparent);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .logo {
                width: 80px;
                height: 80px;
            }
            
            .title {
                font-size: 20px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .heading {
                font-size: 26px;
            }
            
            .search-container {
                margin: 15px auto;
            }
            
            .panel {
                grid-template-columns: 1fr;
            }
            
            .post-title {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                width: 180px;
                left: 10px;
            }
            
            .logo {
                width: 70px;
                height: 70px;
            }
            
            .title {
                font-size: 18px;
            }
            
            .container {
                padding: 10px;
            }
            
            .box, .cbox {
                padding: 15px;
            }
            
            .heading {
                font-size: 22px;
            }
        }
    </style>
</head>

    <script>
        // Navigation Toggle
        const navToggle = document.getElementById('nav-toggle');
        const navLinks = document.getElementById('nav-links');

        navToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Close nav when clicking outside
        document.addEventListener('click', (e) => {
            if (!navToggle.contains(e.target) && !navLinks.contains(e.target)) {
                navLinks.classList.remove('active');
            }
        });

        // Botnet scan effect
        function createScanLine() {
            const scanLine = document.createElement('div');
            scanLine.className = 'scan-line';
            scanLine.style.animationDelay = Math.random() * 3 + 's';
            document.querySelector('.botnet-scan').appendChild(scanLine);
            
            setTimeout(() => {
                scanLine.remove();
            }, 3000);
        }

        // Create initial scan lines
        setInterval(createScanLine, 1000);
    </script>
