   <style>
        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            z-index: 1000;
        }

        .nav-toggle {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }

        .dot {
            width: 20px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        /* Navigation Links */
        .nav-links {
            display: none;
            flex-direction: column;y
            gap: 15px;
            align-items: flex-start; /* Align links to the left */
            position: absolute;
            top: 50px;
            left: 10px; /* Open on the left side */
            background-color: black;
            width: 150px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: gold;
        }

        /* Show navigation links when toggled */
        .nav-links.active {
            display: flex;
        }

        /* Add animation for toggle */
        @keyframes toggle {
            0% { opacity: 0; transform: translateX(-100%); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .nav-links.active {
            animation: toggle 0.3s ease-in-out;
        }
    </style>
</head>
