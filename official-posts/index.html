
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Posts - WHITE-SEC BANGLADESH</title>
    <link href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(40, 0, 40, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(40, 0, 40, 0.1) 0%, transparent 20%);
            color: #ff00ff;
            font-family: 'Quantico', monospace;
            min-height: 100vh;
            padding-top: 60px;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(20, 0, 20, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            border-bottom: 1px solid #ff00ff;
        }

        .nav-toggle {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            padding: 10px;
        }

        .dot {
            width: 20px;
            height: 2px;
            background-color: #ff00ff;
            border-radius: 2px;
            transition: 0.3s;
        }

        .nav-toggle:hover .dot {
            background-color: #cc00cc;
            box-shadow: 0 0 10px #cc00cc;
        }

        .nav-links {
            display: none;
            flex-direction: column;
            gap: 15px;
            position: absolute;
            top: 50px;
            left: 20px;
            background: rgba(10, 0, 10, 0.95);
            width: 200px;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        .nav-links.active {
            display: flex;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-links a {
            color: #ff00ff;
            text-decoration: none;
            padding: 8px 12px;
            border-left: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #cc00cc;
            border-left: 2px solid #cc00cc;
            text-shadow: 0 0 10px #cc00cc;
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Logo Section */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            animation: officialGlow 3s ease-in-out infinite;
        }

        @keyframes officialGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.5));
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.8));
                transform: scale(1.02);
            }
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.6);
            transition: all 0.3s ease;
        }

        .logo:hover {
            box-shadow: 0 0 35px rgba(255, 0, 255, 0.9);
            transform: scale(1.08);
        }

        /* Text Sections */
        .title {
            text-align: center;
            color: white;
            font-size: 24px;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #cc00cc;
            font-size: 18px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(204, 0, 204, 0.5);
        }

        /* Search Bar */
        .search-container {
            display: flex;
            max-width: 500px;
            margin: 20px auto;
            background: rgba(20, 0, 20, 0.3);
            border: 1px solid #ff00ff;
            border-radius: 25px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .search-container:focus-within {
            border-color: #cc00cc;
            box-shadow: 0 0 20px rgba(204, 0, 204, 0.4);
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #ff00ff;
            font-family: 'Quantico', monospace;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: #ff00ff;
            opacity: 0.7;
        }

        .search-btn {
            padding: 12px 20px;
            background: rgba(255, 0, 255, 0.1);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: rgba(255, 0, 255, 0.2);
        }

        .search-btn img {
            width: 16px;
            height: 16px;
            filter: invert(30%) sepia(100%) saturate(1000%) hue-rotate(300deg);
        }

        /* Category Header */
        .cat {
            text-align: center;
            margin: 30px 0;
        }

        .heading {
            color: #ff00ff;
            font-size: 32px;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
            border-bottom: 2px solid #ff00ff;
            padding-bottom: 10px;
            display: inline-block;
            animation: officialPulse 2s infinite;
        }

        @keyframes officialPulse {
            0%, 100% { 
                text-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
                transform: scale(1);
            }
            50% { 
                text-shadow: 0 0 30px rgba(255, 0, 255, 1);
                transform: scale(1.02);
            }
        }

        /* Box Styles */
        .box {
            background: rgba(20, 0, 20, 0.3);
            border: 1px solid #ff00ff;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .box:hover::before {
            left: 100%;
        }

        .box:hover {
            border-color: #cc00cc;
            box-shadow: 0 0 20px rgba(204, 0, 204, 0.4);
            transform: translateY(-3px);
        }

        /* Post Items */
        .post-item {
            text-align: center;
        }

        .post-title {
            color: #cc00cc !important;
            font-size: 22px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(204, 0, 204, 0.6);
        }

        .view-post-button {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255, 0, 255, 0.1);
            color: #ff00ff;
            text-decoration: none;
            border: 1px solid #ff00ff;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-family: 'Quantico', monospace;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .view-post-button:hover {
            background: rgba(255, 0, 255, 0.2);
            color: #cc00cc;
            border-color: #cc00cc;
            box-shadow: 0 0 20px rgba(204, 0, 204, 0.4);
            transform: scale(1.05);
        }

        /* Panel for social links */
        .panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .cbox {
            background: rgba(20, 0, 20, 0.3);
            border: 1px solid #ff00ff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .cbox:hover {
            border-color: #cc00cc;
            box-shadow: 0 0 20px rgba(204, 0, 204, 0.4);
            transform: translateY(-2px);
        }

        .icon {
            width: 40px;
            height: 40px;
            filter: invert(30%) sepia(100%) saturate(1000%) hue-rotate(300deg);
        }

        .txt {
            color: #ff00ff;
            font-size: 16px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff00ff, transparent);
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '⚜️';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff00ff;
            background: #0a0a0a;
            padding: 0 10px;
            font-size: 12px;
        }

        /* No Posts Message */
        .no-posts {
            text-align: center;
            color: #ff00ff;
            font-size: 18px;
            margin: 40px 0;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
            padding: 20px;
            border: 1px dashed #ff00ff;
            border-radius: 8px;
            background: rgba(20, 0, 20, 0.2);
        }

        /* Official Badge Animation */
        .official-badge {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.05;
        }

        .badge {
            position: absolute;
            font-size: 20px;
            color: #ff00ff;
            animation: badgeFloat 10s linear infinite;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        @keyframes badgeFloat {
            0% { 
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0; 
            }
            10% { 
                opacity: 1; 
            }
            90% { 
                opacity: 1; 
            }
            100% { 
                transform: translateY(-100px) rotate(360deg) scale(1);
                opacity: 0; 
            }
        }

        /* Official Seal Animation */
        .official-seal {
            text-align: center;
            margin: 10px 0;
        }

        .seal {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid #ff00ff;
            border-radius: 20px;
            color: #ff00ff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: sealGlow 2s ease-in-out infinite;
        }

        @keyframes sealGlow {
            0%, 100% { 
                box-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
            }
            50% { 
                box-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .logo {
                width: 80px;
                height: 80px;
            }
            
            .title {
                font-size: 20px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .heading {
                font-size: 26px;
            }
            
            .search-container {
                margin: 15px auto;
            }
            
            .panel {
                grid-template-columns: 1fr;
            }
            
            .post-title {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                width: 180px;
                left: 10px;
            }
            
            .logo {
                width: 70px;
                height: 70px;
            }
            
            .title {
                font-size: 18px;
            }
            
            .container {
                padding: 10px;
            }
            
            .box, .cbox {
                padding: 15px;
            }
            
            .heading {
                font-size: 22px;
            }
        }

        /* Terminal Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff00ff;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cc00cc;
        }
    </style>
</head>

    <script>
        // Navigation Toggle
        const navToggle = document.getElementById('nav-toggle');
        const navLinks = document.getElementById('nav-links');

        navToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Close nav when clicking outside
        document.addEventListener('click', (e) => {
            if (!navToggle.contains(e.target) && !navLinks.contains(e.target)) {
                navLinks.classList.remove('active');
            }
        });

        // Official Badge Animation
        function createOfficialBadge() {
            const badgeAnim = document.getElementById('official-badge');
            const symbols = ['⚜️', '🔰', '⭐', '🏴', '🔸', '🔷', '💠', '🎖️'];
            const badge = document.createElement('div');
            badge.className = 'badge';
            badge.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            badge.style.left = Math.random() * 100 + 'vw';
            badge.style.animationDelay = Math.random() * 10 + 's';
            badge.style.fontSize = (Math.random() * 20 + 16) + 'px';
            badgeAnim.appendChild(badge);
            
            setTimeout(() => {
                badge.remove();
            }, 10000);
        }

        // Create initial badge animation
        for (let i = 0; i < 6; i++) {
            setTimeout(createOfficialBadge, i * 1500);
        }
        setInterval(createOfficialBadge, 2000);

        // Add official styling to post titles
        document.addEventListener('DOMContentLoaded', function() {
            const postTitles = document.querySelectorAll('.post-title');
            postTitles.forEach(title => {
                title.style.textTransform = 'uppercase';
                title.style.letterSpacing = '1px';
            });
        });
    </script>
