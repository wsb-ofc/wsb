            <div class="post-content"><div class=\"html-div xdj266r x11i5rnm xat24cr x1mh8g0r xexx8yu x4uap5 x18d9i69 xkhd6sd\" style=\"margin: 0px; padding: 0px; font-family: inherit;\"><div dir=\"auto\" class=\"html-div xdj266r x11i5rnm xat24cr x1mh8g0r xexx8yu x4uap5 x18d9i69 xkhd6sd\" style=\"margin: 0px; padding: 0px; font-family: inherit;\"><div data-ad-rendering-role=\"story_message\" class=\"html-div xdj266r x11i5rnm xat24cr x1mh8g0r xexx8yu x4uap5 x18d9i69 xkhd6sd\" style=\"margin: 0px; padding: 0px; font-family: inherit;\"><div class=\"x1l90r2v x1iorvi4 x1ye3gou xn6708d\" data-ad-comet-preview=\"message\" data-ad-preview=\"message\" id=\"«r15f»\" style=\"padding: 4px 12px 16px; font-family: inherit;\"><div class=\"x78zum5 xdt5ytf xz62fqu x16ldp7u\" style=\"display: flex; flex-direction: column; margin-top: -5px; margin-bottom: -5px; font-family: inherit;\"><div class=\"xu06os2 x1ok221b\" style=\"margin-top: 5px; margin-bottom: 5px; font-family: inherit;\"><span class=\"x193iq5w xeuugli x13faqbe x1vvkbs x1xmvt09 x1lliihq x1s928wv xhkezso x1gmr53x x1cpjm7i x1fgarty x1943h6x xudqn12 x3x7a5m x1f6kntn xvq8zen xo1l8bm xzsf02u x1yc453h\" dir=\"auto\" style=\"overflow-wrap: break-word; max-width: 100%; word-break: break-word; font-size: 0.875rem; display: block; font-family: inherit; line-height: 1.3333; color: rgb(226, 229, 233); min-width: 0px;\"><div class=\"x11i5rnm xat24cr x1mh8g0r x1vvkbs xtlvy1s x126k92a\" style=\"margin: 0.5em 0px 0px; overflow-wrap: break-word; white-space-collapse: preserve; font-family: inherit;\"><div dir=\"auto\" style=\"font-family: inherit;\">আমরা যে সনে দাঁড়িয়ে আছি সেটা ২০২৫।  চারিদিকে নগ্নতা আর অশ্লীলতার ছড়াছড়ি,হাত বাড়ালেই নীল জগতের হাতছানি , ক্লাস ৬ এর মেয়ে যতটুকু যৌনতা যেটুকু  ধারণা রাখে কিছু ক্ষেত্রে দেখা যায় তার থেকে ১০ বছরের সিনিয়র আপু সেটুকু ধারণা রাখেনা। এটা কি কারণে হয়েছে? ইন্টারনেটের সহজলভ্যতা আর স্মার্টনেস দেখানোর প্রবণতার জন্য।</div><div dir=\"auto\" style=\"font-family: inherit;\">যদি কোথাও দেখা যায় ১৭ বছর মেয়ের বিয়ে হচ্ছে সেখানে এদেশের নারীবাদি আর কথিত সুশীল সমাজের আগ্রাসন, বাবা আর ছেলেকে কারাদণ্ড আর পরেরদিন পত্রিকার কলামে বাঘের হুঙ্কার ছেড়ে নিজেদের পশ্চিমা সভ্যতার ধারক বাহক হিসেবে তুলে ধরার প্রতিযোগিতা।  অথচ প্রতিনিয়ত আমাদের সমাজে চলছে বাল্যজিনা, প্রায়শই ঢাকার ডাস্টবিন গুলোর ভিতর পাওয়া যায় কিছু পরিচয়হীন ফুটফুটে কন্যাশিশু, ছেলে শিশু, এগুলো নিয়ে এদেশের আলেম সমাজের কন্ঠ শীতের রাতের ৫০ হাজার টাকার মাহফিল পর্যন্ত।</div></div><div class=\"x11i5rnm xat24cr x1mh8g0r x1vvkbs xtlvy1s x126k92a\" style=\"margin: 0.5em 0px 0px; overflow-wrap: break-word; white-space-collapse: preserve; font-family: inherit;\"><div dir=\"auto\" style=\"font-family: inherit;\">আমাদের কিছু পয়েন্ট ডিফাইন করতে হবে:</div></div><div class=\"x11i5rnm xat24cr x1mh8g0r x1vvkbs xtlvy1s x126k92a\" style=\"margin: 0.5em 0px 0px; overflow-wrap: break-word; white-space-collapse: preserve; font-family: inherit;\"><div dir=\"auto\" style=\"font-family: inherit;\">বিয়ে মানুষ কেন করে? শুধু শারীরিক চাহিদার জন্য নাকি একটা স্টাবল সম্পর্কের জন্য,কিছুদিন আগে আমেরিকান এক বিশ্ববিদ্যালয়ের গবেষনায় উঠে এসেছে কিছু ভয়ংকর তথ্য। আমরা প্রতিনিয়ত যে খাবার খাই সেটা ভেজাযুক্ত হওয়ার কারণে মানবদেহের কিছু হরমোনের অতিরিক্ত রিয়াকশনের ফলে অস্বাভাবিকভাবে যৌন চাহিদা, ডিপ্রেশন, একাকীত্ব বেড়ে যেতে পারে। এছাড়া বর্তমান জেনারেশনের অতিরিক্ত ডিভাইস ব্যাবহারের জন্য মুটিয়ে যাওয়া, চোখের সমস্যা সহ হাজার টা রোগবালাই বাসা বাধছে প্রতিনিয়ত। </div></div><div class=\"x11i5rnm xat24cr x1mh8g0r x1vvkbs xtlvy1s x126k92a\" style=\"margin: 0.5em 0px 0px; overflow-wrap: break-word; white-space-collapse: preserve; font-family: inherit;\"><div dir=\"auto\" style=\"font-family: inherit;\">এবার আমাদের ফিরে যেতে হবে একটু ব্যাকইন্ডে :</div></div><div class=\"x11i5rnm xat24cr x1mh8g0r x1vvkbs xtlvy1s x126k92a\" style=\"margin: 0.5em 0px 0px; overflow-wrap: break-word; white-space-collapse: preserve; font-family: inherit;\"><div dir=\"auto\" style=\"font-family: inherit;\">এই পৃথিবীর বুকে কারা নিউ ওয়ার্ল্ড অর্ডার প্রতিষ্ঠা করতে চায় এবং কেন চায়? এবং এই বিষয়টির সাথে উপরোক্ত দুটি বিষয়ের কি মিল রয়েছে? </div></div><div class=\"x11i5rnm xat24cr x1mh8g0r x1vvkbs xtlvy1s x126k92a\" style=\"margin: 0.5em 0px 0px; overflow-wrap: break-word; white-space-collapse: preserve; font-family: inherit;\"><div dir=\"auto\" style=\"font-family: inherit;\">Hint 1.আমরা জানি সারাবিশ্বে যত প্রকার ফুড , কসমেটিক, টেক, বিনোদন ইন্ড্রাস্ট্রি গুলার  নিয়ন্ত্রণ কারা করে। </div></div><div class=\"x11i5rnm xat24cr x1mh8g0r x1vvkbs xtlvy1s x126k92a\" style=\"margin: 0.5em 0px 0px; overflow-wrap: break-word; white-space-collapse: preserve; font-family: inherit;\"><div dir=\"auto\" style=\"font-family: inherit;\">Hint 2. বর্তমান সময়ে অমুসলিমদের সাথে মুসলিমদের যে মনস্তাত্ত্বিক যুদ্ধ চলছে এর পিছনে কি কারণ এবং কেন? </div></div><div class=\"x11i5rnm xat24cr x1mh8g0r x1vvkbs xtlvy1s x126k92a\" style=\"margin: 0.5em 0px 0px; overflow-wrap: break-word; white-space-collapse: preserve; font-family: inherit;\"><div dir=\"auto\" style=\"font-family: inherit;\">উত্তর : বই (তৃতীয় বিশ্বযুদ্ধ ও দাজ্জাল)</div></div><div class=\"x11i5rnm xat24cr x1mh8g0r x1vvkbs xtlvy1s x126k92a\" style=\"margin: 0.5em 0px 0px; overflow-wrap: break-word; white-space-collapse: preserve; font-family: inherit;\"><div dir=\"auto\" style=\"font-family: inherit;\">এখন এই সম্যার সমাধানে আমাদের কি করনীয়?</div></div><div class=\"x11i5rnm xat24cr x1mh8g0r x1vvkbs xtlvy1s x126k92a\" style=\"margin: 0.5em 0px 0px; overflow-wrap: break-word; white-space-collapse: preserve; font-family: inherit;\"><div dir=\"auto\" style=\"font-family: inherit;\">চোখ রাখুন আগামী পর্বে:..............</div></div></span></div></div></div></div></div><div id=\"«r15g»\" class=\"html-div xdj266r x11i5rnm xat24cr x1mh8g0r xexx8yu x4uap5 x18d9i69 xkhd6sd x1n2onr6\" style=\"margin: 0px; position: relative; padding: 0px; font-family: inherit;\"><div class=\"html-div xdj266r x11i5rnm xat24cr x1mh8g0r xexx8yu x4uap5 x18d9i69 xkhd6sd x1n2onr6\" style=\"margin: 0px; position: relative; padding: 0px; font-family: inherit;\"><a attributionsrc=\"/privacy_sandbo     <!-- Pop-up Image Modal -->
    <div id="popup-modal" class="popup-modal">
        <span class="close-btn" id="close-btn">&times;</span>
        <img class="popup-content" id="popup-content" alt="Popup Image">
    </div>

    <script>
        // Navigation Toggle
        const navToggle = document.getElementById('nav-toggle');
        const navLinks = document.getElementById('nav-links');

        navToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Close nav when clicking outside
        document.addEventListener('click', (e) => {
            if (!navToggle.contains(e.target) && !navLinks.contains(e.target)) {
                navLinks.classList.remove('active');
            }
        });

        // Image Popup Modal
        const postImage = document.getElementById('post-image');
        const popupModal = document.getElementById('popup-modal');
        const popupContent = document.getElementById('popup-content');
        const closeBtn = document.getElementById('close-btn');

        if (postImage) {
            postImage.addEventListener('click', () => {
                popupContent.src = postImage.src;
                popupModal.style.display = 'block';
            });
        }

        closeBtn.addEventListener('click', () => {
            popupModal.style.display = 'none';
        });

        popupModal.addEventListener('click', (e) => {
            if (e.target === popupModal) {
                popupModal.style.display = 'none';
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                popupModal.style.display = 'none';
            }
        });

        // Official Badge Animation
        function createOfficialBadge() {
            const badgeAnim = document.getElementById('official-badge');
            const symbols = ['⚜️', '🔰', '⭐', '🏴', '🔸', '🔷', '💠', '🎖️'];
            const badge = document.createElement('div');
            badge.className = 'badge';
            badge.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            badge.style.left = Math.random() * 100 + 'vw';
            badge.style.animationDelay = Math.random() * 10 + 's';
            badge.style.fontSize = (Math.random() * 20 + 16) + 'px';
            badgeAnim.appendChild(badge);
            
            setTimeout(() => {
                badge.remove();
            }, 10000);
        }

        // Create initial badge animation
        for (let i = 0; i < 6; i++) {
            setTimeout(createOfficialBadge, i * 1500);
        }
        setInterval(createOfficialBadge, 2000);

        // Add terminal cursor effect to titles
        document.addEventListener('DOMContentLoaded', function() {
            const titles = document.querySelectorAll('.post-title');
            titles.forEach(title => {
                title.classList.add('terminal-cursor');
            });

            // Style code blocks
            const codeBlocks = document.querySelectorAll('code');
            codeBlocks.forEach(block => {
                block.style.fontFamily = "'Courier New', monospace";
                block.style.background = 'rgba(255, 0, 255, 0.1)';
                block.style.padding = '2px 6px';
                block.style.borderRadius = '3px';
                block.style.border = '1px solid #ff00ff';
                block.style.color = '#ff00ff';
            });
        });
    </script>
